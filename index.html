<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #4cc9f0;
            --danger: #f72585;
            --dark: #212529;
            --light: #f8f9fa;
            --gray: #6c757d;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* LED Background Effect */
        .led-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
        }

        .led-strip {
            position: absolute;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, 
                #ff0000, #ff8000, #ffff00, #80ff00, 
                #00ff00, #00ff80, #00ffff, #0080ff, 
                #0000ff, #8000ff, #ff00ff, #ff0080);
            background-size: 1200% 100%;
            animation: led-animation 8s linear infinite;
            filter: blur(1px);
        }

        .led-strip:nth-child(2) { top: 20%; animation-delay: -1s; }
        .led-strip:nth-child(3) { top: 40%; animation-delay: -2s; }
        .led-strip:nth-child(4) { top: 60%; animation-delay: -3s; }
        .led-strip:nth-child(5) { top: 80%; animation-delay: -4s; }

        @keyframes led-animation {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--gray);
        }

        .settings-link {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .settings-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-item { display: flex; align-items: center; gap: 10px; }

        .status-indicator {
            width: 12px; height: 12px; border-radius: 50%; background: var(--danger);
        }

        .status-indicator.connected {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--border-radius);
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
            margin-bottom: 25px;
        }

        .card-header {
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }

        .node-btn { opacity: 0.7; border: 1px solid transparent; min-width: 120px; }
        .node-btn.active {
            opacity: 1; border-color: var(--success);
            background: rgba(76, 201, 240, 0.1);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.3);
        }

        .node-status { font-size: 0.7rem; display: block; margin-top: 2px; color: var(--gray); }

        .toggle-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toggle { position: relative; display: inline-block; width: 60px; height: 30px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--gray); transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(30px); }

        .dropdown-container { position: relative; margin-top: 15px; margin-bottom: 20px; }
        .dropdown-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: rgba(255, 255, 255, 0.1);
            border-radius: 8px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dropdown-list {
            background: rgba(30, 30, 46, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0 0 8px 8px; max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease; z-index: 10; backdrop-filter: blur(10px);
        }
        .dropdown-list.show { max-height: 250px; overflow-y: auto; }
        .dropdown-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .dropdown-item.active { background: var(--primary); }

        .slider-container { margin: 20px 0; }
        .range-slider {
            width: 100%; height: 8px; -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1); border-radius: 4px; outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px;
            border-radius: 50%; background: var(--primary); cursor: pointer;
        }

        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--light); }
        .action-buttons { display: flex; gap: 15px; margin-top: 20px; }

        .color-preview { width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.3); }
        
        footer { text-align: center; margin-top: 40px; padding: 20px; color: var(--gray); }
    </style>
</head>
<body>
    <div class="led-background"><div class="led-strip"></div><div class="led-strip"></div><div class="led-strip"></div></div>

    <div class="container">
        <header>
            <h1><i class="fas fa-lightbulb"></i> Lumina Control</h1>
            <p class="subtitle">Advanced Multi-Device Command Router</p>
            <a href="settings.html" class="settings-link"><i class="fas fa-cog"></i> Settings</a>
        </header>

        <div class="status-bar">
            <div class="status-item"><div class="status-indicator" id="connectionStatus"></div><span id="statusText">Connecting...</span></div>
            <div class="status-item"><i class="fas fa-microchip"></i><span>Gateway: <span id="currentDeviceId">--</span></span></div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-network-wired"></i><h2>Device Registry & Routing</h2></div>
            <div id="nodeList" class="action-buttons" style="flex-wrap: wrap; gap: 10px;">
                <button class="btn btn-secondary node-btn active" data-target="local">
                    <div><i class="fas fa-server"></i> Gateway<span class="node-status">Main Controller</span></div>
                </button>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="card-header"><i class="fas fa-power-off"></i><h2>Power & Sync</h2></div>
                <div class="toggle-container">
                    <span class="toggle-label">Power State</span>
                    <label class="toggle"><input type="checkbox" id="powerToggle"><span class="slider"></span></label>
                </div>
                <div id="mirrorControlContainer" class="toggle-container" style="display: none; background: rgba(67, 97, 238, 0.1); padding: 10px; border-radius: 8px;">
                    <span class="toggle-label"><i class="fas fa-copy"></i> Mirror Gateway</span>
                    <label class="toggle"><input type="checkbox" id="mirrorToggle"><span class="slider"></span></label>
                </div>
                <hr style="border-color: rgba(255, 255, 255, 0.1); margin: 20px 0;">
                <div class="toggle-container">
                    <span class="toggle-label">Timer Enabled</span>
                    <label class="toggle"><input type="checkbox" id="timerToggle"><span class="slider"></span></label>
                </div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="time" id="timerOnTimeInput" style="flex:1; padding:8px; border-radius:5px; border:none; background:rgba(255,255,255,0.1); color:white;">
                    <input type="time" id="timerOffTimeInput" style="flex:1; padding:8px; border-radius:5px; border:none; background:rgba(255,255,255,0.1); color:white;">
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-palette"></i><h2>Effects & Color</h2></div>
                <div class="dropdown-container">
                    <div class="dropdown-header" id="dropdownHeader"><span id="selectedEffect">Select Effect</span><i class="fas fa-chevron-down"></i></div>
                    <div class="dropdown-list" id="dropdownList"></div>
                </div>
                <div class="slider-container">
                    <div style="display:flex; justify-content:space-between;"><span>Speed</span><span id="speedValue">50</span></div>
                    <input type="range" min="10" max="200" value="50" class="range-slider" id="speedSlider">
                </div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <div class="color-preview" id="colorPreview"></div>
                    <input type="color" id="colorPicker" value="#FF0000" style="width:50px; height:40px; border:none; background:transparent;">
                    <button class="btn btn-secondary" id="randomColorBtn"><i class="fas fa-random"></i></button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-user-check"></i><h2>Sensors</h2></div>
                <div style="display:flex; justify-content:space-between; background:rgba(0,0,0,0.2); padding:15px; border-radius:8px;">
                    <span>Presence:</span><span id="presenceValue" style="color:var(--success); font-weight:bold;">--</span>
                </div>
                <button class="btn btn-primary" id="calibrateMicBtn" style="width:100%; margin-top:20px; justify-content:center;"><i class="fas fa-microphone"></i> Calibrate Mic</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-8dRf8a9y7v9y8z7x6w5v4u3y2i1o0p9",
            authDomain: "test-dbd7a-default-rtdb.firebaseapp.com",
            databaseURL: "https://test-dbd7a-default-rtdb.firebaseio.com",
            projectId: "test-dbd7a",
            storageBucket: "test-dbd7a.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const effects = ["Rainbow Cycle", "Meteor Shower", "Digital Rain", "Pulsing Spheres", "Binary Clock", "Vortex", "DNA Helix", "Audio Visualizer", "Lava Lamp", "Radar Sweep", "Quantum Particles", "Neural Network", "Galaxy Spin", "Crystal Growth", "Lightning Storm", "Ocean Depth", "Northern Lights", "Time Tunnel", "Cyber City", "Solar Flare", "Fire Simulation", "Solid Color", "Frequency Spectrum", "Reactive Waveform", "Beat Pulse", "Frequency Bloom", "Audio Reactive Fire", "Musical Rainbow", "Reactive Strobe", "Guitar Visualizer", "Cascading Frequency", "Energy Orbits", "Audio Ripples"];

        let currentState = {
            deviceId: localStorage.getItem('lastDeviceId') || 'friend1_leds',
            currentTarget: 'local',
            activeNodes: {}
        };

        const nodeList = document.getElementById('nodeList');
        const mirrorToggle = document.getElementById('mirrorToggle');
        const mirrorControlContainer = document.getElementById('mirrorControlContainer');
        const powerToggle = document.getElementById('powerToggle');
        const speedSlider = document.getElementById('speedSlider');
        const colorPicker = document.getElementById('colorPicker');
        const dropdownHeader = document.getElementById('dropdownHeader');
        const dropdownList = document.getElementById('dropdownList');

        function updateFirebaseValue(path, value) {
            if (!currentState.deviceId) return;
            const base = `/devices/${currentState.deviceId}/`;
            const target = currentState.currentTarget === 'local' ? 'local' : `receivers/${currentState.currentTarget}`;
            const fullPath = base + target + '/' + path;
            database.ref(fullPath).set(value);
        }

        let firebaseListeners = [];
        function removeListeners() {
            firebaseListeners.forEach(ref => ref.off());
            firebaseListeners = [];
        }

        function initListeners() {
            if (!currentState.deviceId) return;
            removeListeners();
            const base = `/devices/${currentState.deviceId}/`;
            
            // Discovery
            const activeRef = database.ref(base + 'active_nodes');
            firebaseListeners.push(activeRef);
            activeRef.on('value', snap => {
                currentState.activeNodes = snap.val() || {};
                const gatewayBtn = nodeList.querySelector('[data-target="local"]');
                nodeList.innerHTML = '';
                nodeList.appendChild(gatewayBtn);
                Object.keys(currentState.activeNodes).forEach(mac => {
                    const btn = document.createElement('button');
                    btn.className = `btn btn-secondary node-btn ${currentState.currentTarget === mac ? 'active' : ''}`;
                    btn.dataset.target = mac;
                    btn.innerHTML = `<div><i class="fas fa-lightbulb"></i> Receiver<span class="node-status">${mac}</span></div>`;
                    nodeList.appendChild(btn);
                });
            });

            // Target state
            const target = currentState.currentTarget === 'local' ? 'local' : `receivers/${currentState.currentTarget}`;
            const targetRef = database.ref(base + target);
            firebaseListeners.push(targetRef);

            mirrorControlContainer.style.display = (currentState.currentTarget === 'local') ? 'none' : 'flex';

            targetRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;
                
                powerToggle.checked = !!data.enabled;
                if (data.isMirror !== undefined) mirrorToggle.checked = !!data.isMirror;
                
                speedSlider.value = data.speed || 50;
                document.getElementById('speedValue').textContent = data.speed || 50;
                
                const color = data.color || "FF0000";
                colorPicker.value = '#' + color;
                document.getElementById('colorPreview').style.backgroundColor = '#' + color;
                
                document.getElementById('selectedEffect').textContent = effects[data.effect] || 'Rainbow Cycle';
                
                document.getElementById('connectionStatus').className = 'status-indicator connected';
                document.getElementById('statusText').textContent = 'Target Online';
            });

            // Timers & Sensors (Always from Local)
            const localRef = database.ref(base + 'local');
            firebaseListeners.push(localRef);
            localRef.on('value', snap => {
                const data = snap.val();
                if (!data) return;
                document.getElementById('timerToggle').checked = !!data.timer_enabled;
                document.getElementById('timerOnTimeInput').value = data.timer_on || "09:00";
                document.getElementById('timerOffTimeInput').value = data.timer_off || "17:00";
                
                if (data.sensor_stats && data.sensor_stats.sensors) {
                    document.getElementById('presenceValue').textContent = data.sensor_stats.sensors.presence ? 'YES' : 'NO';
                }
            });
        }

        nodeList.addEventListener('click', e => {
            const btn = e.target.closest('.node-btn');
            if (!btn) return;
            document.querySelectorAll('.node-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentState.currentTarget = btn.dataset.target;
            initListeners();
        });

        powerToggle.addEventListener('change', () => updateFirebaseValue('enabled', powerToggle.checked));
        mirrorToggle.addEventListener('change', () => updateFirebaseValue('isMirror', mirrorToggle.checked));
        speedSlider.addEventListener('input', () => document.getElementById('speedValue').textContent = speedSlider.value);
        speedSlider.addEventListener('change', () => updateFirebaseValue('speed', parseInt(speedSlider.value)));
        colorPicker.addEventListener('change', () => {
            const color = colorPicker.value.substring(1).toUpperCase();
            document.getElementById('colorPreview').style.backgroundColor = '#' + color;
            updateFirebaseValue('color', color);
        });
        
        document.getElementById('timerToggle').addEventListener('change', (e) => updateFirebaseValue('timer_enabled', e.target.checked));
        document.getElementById('timerOnTimeInput').addEventListener('change', (e) => updateFirebaseValue('timer_on', e.target.value));
        document.getElementById('timerOffTimeInput').addEventListener('change', (e) => updateFirebaseValue('timer_off', e.target.value));

        dropdownHeader.addEventListener('click', () => dropdownList.classList.toggle('show'));
        effects.forEach((name, i) => {
            const item = document.createElement('div');
            item.className = 'dropdown-item';
            item.textContent = name;
            item.onclick = () => {
                updateFirebaseValue('effect', i);
                dropdownList.classList.remove('show');
            };
            dropdownList.appendChild(item);
        });

        document.getElementById('calibrateMicBtn').addEventListener('click', () => {
            const base = `/devices/${currentState.deviceId}/local/`;
            database.ref(base + 'mic_calibration').set(true);
            setTimeout(() => database.ref(base + 'mic_calibration').set(false), 5000);
        });

        document.getElementById('currentDeviceId').textContent = currentState.deviceId;
        initListeners();
    </script>
</body>
</html>
